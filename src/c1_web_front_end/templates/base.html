<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EcoCommute{% endblock %}</title>
  <style>
    :root { --bg:#f6f8f5; --card:#fff; --text:#1d2a20; --muted:#5d6b61; --accent:#2f7d4f; --line:#d8e0d9; --err:#a63a2b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141a16; --card:#1d2620; --text:#e6eee8; --muted:#a3b2a7; --accent:#59b57f; --line:#2f3b33; --err:#e58a7b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
    main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
    h1 { margin:0 0 4px; font-size:1.6rem; }
    .sub { color:var(--muted); margin:0 0 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    label { display:block; font-weight:600; margin:12px 0 4px; }
    input[type=text], input[type=number], input[type=date], select {
      width:100%; padding:10px; font:inherit; color:inherit; background:var(--bg);
      border:1px solid var(--line); border-radius:8px; }
    .checks label { display:inline-block; font-weight:400; margin:4px 16px 0 0; }
    button { margin-top:16px; width:100%; padding:12px; font:inherit; font-weight:600; color:#fff;
      background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
    .errors { border-color:var(--err); color:var(--err); }
    .errors ul { margin:0; padding-left:20px; }
    dl { display:grid; grid-template-columns:1fr auto; gap:6px 12px; margin:0; }
    dt { color:var(--muted); } dd { margin:0; font-weight:600; text-align:right; }
    .note { color:var(--muted); font-size:.9rem; }
    nav { display:flex; gap:16px; margin-bottom:16px; }
    nav a { color:var(--accent); font-weight:600; text-decoration:none; }
    table { width:100%; border-collapse:collapse; font-size:.95rem; }
    th, td { text-align:right; padding:6px 4px; border-bottom:1px solid var(--line); }
    th:first-child, td:first-child { text-align:left; }
    .linkbtn { margin:0; padding:6px 10px; width:auto; font-size:.85rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
    .bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:6px 0 4px; }
    .bar i { display:block; height:100%; background:var(--accent); }
    .done { border-color:var(--accent); }
    .banner { border-color:var(--accent); }
    h2 { font-size:1.1rem; margin:0 0 8px; }
  </style>
</head>
<body>
<main>
  <nav><a href="/">Log a trip</a><a href="/compare">Compare routes</a><a href="/achievements">Achievements</a></nav>
  {% block content %}{% endblock %}
</main>
</body>
</html>
