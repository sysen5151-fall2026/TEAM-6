name: tests

# An unmet requirement turns this build red. Tests are named by requirement ID
# (tests/test_functional_requirements.py) and run with the rest of the suite.
on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
